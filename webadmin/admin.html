<!doctype html>
<html>
	<head>
		<title>Mox Admin</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
:root { color-scheme: light; --fg: #1f2328; --fg-mild: #57606a; --bg: #ffffff; --bg-mild: #f6f8fa; --border: #d0d7de; --accent: #0969da; --radius: 6px; }
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body { padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', ubuntu, lato, sans-serif; font-size: 1rem; line-height: 1.5; color: var(--fg); background: var(--bg); -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { line-height: 1.25; font-weight: 600; margin: 1.5em 0 .5em; }
h1 { font-size: 1.4rem; margin-top: 0; }
h2 { font-size: 1.15rem; }
h3, h4 { font-size: 1rem; }
p { margin-bottom: 1em; max-width: 60rem; }
ul, ol { margin: 0 0 1em; padding-left: 1.4rem; }
li { margin: .15em 0; }
a { color: var(--accent); text-underline-offset: 2px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
code, kbd, samp { font-family: 'ubuntu mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
.literal { margin: 1em 0; padding: .75em 1em; background: var(--bg-mild); border: 1px solid var(--border); border-radius: var(--radius); white-space: pre-wrap; overflow-x: auto; font-family: 'ubuntu mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875rem; tab-size: 4; }
table { border-collapse: collapse; margin: .5em 0; }
td, th { padding: .3em .6em; text-align: left; vertical-align: top; }
th { font-weight: 600; }
table table td, table table th { padding: .1em .2em; }
table.long > tbody > tr > td { padding: .9em .6em; }
table > tbody > tr:nth-child(odd) { background: var(--bg-mild); }
table.hover > tbody > tr:hover { background: var(--bg-mild); }
thead { position: sticky; top: 0; background: var(--bg); }
thead th { border-bottom: 1px solid var(--border); }
fieldset { border: 0; min-width: 0; }
.text { max-width: 60rem; }
[title] { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
.twocols { display: flex; gap: 2.5em; flex-wrap: wrap; }
.unclutter { opacity: .5; transition: opacity .12s ease; }
.unclutter:hover, .unclutter:focus-within { opacity: 1; }
.scriptswitch { text-decoration: underline 2px #bf8700; }
input, select, textarea, button, .button { font: inherit; font-size: .95rem; }
input, select, textarea { color: var(--fg); background: var(--bg); border: 1px solid #8c959f; border-radius: var(--radius); padding: .3em .5em; }
textarea { resize: vertical; min-height: 2.5em; }
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: var(--fg-mild); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
button, .button, input[type=submit], input[type=button] { color: var(--fg); background: var(--bg-mild); border: 1px solid var(--border); border-radius: var(--radius); padding: .3em .8em; cursor: pointer; transition: background-color .12s ease, border-color .12s ease; }
button:hover:not(:disabled), .button:hover:not(:disabled), input[type=submit]:hover:not(:disabled) { background: var(--bg); border-color: #8c959f; }
button:focus-visible, .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled, .button:disabled { opacity: .55; cursor: default; }
input[type=checkbox], input[type=radio] { width: auto; }
@media (max-width: 820px) { .app { flex-direction: column; } .sidebar { position: static; align-self: stretch; height: auto; width: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); } .sidebar a.navLink { display: inline-block; } .twocols { display: block; } .content { padding: 1rem .75rem 3rem; } }
#page, .loadend { opacity: 1; animation: fadein .15s ease-in; }
#page.loading, .loadstart { opacity: .1; animation: fadeout 1s ease-out; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
@keyframes fadeout { from { opacity: 1 } to { opacity: .1 } }

.app { display: flex; align-items: stretch; min-height: 100dvh; }
.sidebar { flex: 0 0 15rem; position: sticky; top: 0; align-self: flex-start; height: 100dvh; overflow-y: auto; box-sizing: border-box; padding: 1.25rem 1rem; background: var(--bg-mild); border-right: 1px solid var(--border); }
.sidebar .brand { font-weight: 600; font-size: 1.05rem; margin-bottom: 1rem; }
.sidebar .navGroup { margin: 1.1rem 0 .3rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-mild); }
.sidebar a.navLink { display: block; padding: .3em .55em; margin: 1px 0; border-radius: var(--radius); color: var(--fg); text-decoration: none; }
.sidebar a.navLink:hover { background: var(--bg); }
.sidebar a.navLink.active { background: var(--accent); color: #ffffff; }
.content { flex: 1 1 auto; min-width: 0; padding: 1.5rem 1.5rem 4rem; }
/* css placeholder */
		</style>
	</head>
	<body>
		<div id="page"><div style="padding: 1em; text-align: center">Loading...</div></div>
		<script>
/* js placeholder */
		</script>
	</body>
</html>
